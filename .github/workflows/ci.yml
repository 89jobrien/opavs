name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      - name: Resolve crux commit
        id: crux-sha
        run: echo "sha=$(git ls-remote https://github.com/89jobrien/crux HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache crux binary
        id: cache-crux
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/crux
          key: crux-bin-${{ runner.os }}-${{ steps.crux-sha.outputs.sha }}

      - name: Install crux
        if: steps.cache-crux.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/89jobrien/crux crux-cli --locked

      - name: Run CI pipeline
        run: crux run .ci/ci.crux
