[package]
name = "opavs"
version = "0.0.1"
edition = "2024"
description = "Orient-Plan-Act-Verify-Ship phase discipline CLI: phase gating, PreToolUse guard, and task-graph engine"
license = "MIT OR Apache-2.0"
authors = ["Joseph O'Brien"]

[lib]
name = "opavs"
path = "src/lib.rs"

[[bin]]
name = "opavs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
assert_cmd = "2"
predicates = "3"
